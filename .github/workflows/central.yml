name: Central integration
on:
  pull_request:
    paths: ['central/**', 'ui/**', 'desktop/**', 'engine/**', 'scripts/**', 'package*.json', 'pom.xml', 'forge', '.github/workflows/central.yml']
  push:
    branches: [main]
    paths: ['central/**', 'ui/**', 'desktop/**', 'engine/**', 'scripts/**', 'package*.json', 'pom.xml', 'forge', '.github/workflows/central.yml']
permissions:
  contents: read
jobs:
  central:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run central:smoke
      - run: npm run central:smoke-package
      - run: npx playwright install --with-deps chromium
      - run: npm run central:test
        env:
          CENTRAL_TEST_PRODUCTION: '1'
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci --ignore-scripts
      - run: npm run engine:build
      - run: npm run engine:smoke-central
